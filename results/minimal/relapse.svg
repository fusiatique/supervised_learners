<rect width="716" height="316" fill="#fcfcfb"/>
<text x="52.0" y="22.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">Relapse after abstinence</text>
<text x="52.0" y="39.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">Dependent agents (20 forced doses) lose access to the drug, then get it back. Of 20, dependent 20,000 steps later.</text>
<text x="52.0" y="54.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">Mean B when the drug returns: 0 steps → 0, 250 steps → 9, 500 steps → 16, 1000 steps → 25, 2000 steps → 35, 5000 steps → 40.</text>
